[include fluidd.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044506110E0521C-if00

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044506130870F1C-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[force_move]
enable_force_move: true

[gcode_macro UNSAFE_ALLOW_JOG]
description: Allow Fluidd jogging without homing
gcode:
  SET_KINEMATIC_POSITION X=0 Y=0 Z=0

[gcode_macro UNSAFE_CLEAR_KINEMATIC]
description: Clear fake kinematic position
gcode:
  SET_KINEMATIC_POSITION CLEAR=XYZ

[stepper_x]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_max: 235
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
diag_pin: ^gpio4
run_current: 0.580
stealthchop_threshold: 0
driver_SGTHRS: 80

[stepper_y]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 0
position_max: 235
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
diag_pin: ^gpio3
run_current: 0.580
stealthchop_threshold: 0
driver_SGTHRS: 80

[stepper_z]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 16
rotation_distance: 8
endstop_pin: ^gpio25
position_endstop: 0.0
position_max: 250

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

[extruder]
step_pin: gpio14
dir_pin: !gpio13
enable_pin: !gpio15
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio23
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio27
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250

[tmc2209 extruder]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
run_current: 0.650
stealthchop_threshold: 999999

[heater_bed]
heater_pin: gpio21
sensor_type: ATC Semitec 104GT-2
sensor_pin: gpio26
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: gpio17

[heater_fan heatbreak_cooling_fan]
pin: gpio18

[heater_fan controller_fan]
pin: gpio20

[temperature_sensor pico]
sensor_type: temperature_mcu

[temperature_sensor eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy

[virtual_sdcard]
path: /home/pegoku/printer_data/gcodes
on_error_gcode: CANCEL_PRINT
