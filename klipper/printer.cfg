[include fluidd.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044506110E0521C-if00

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044506130870F1C-if00
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 150
max_accel: 1500
max_z_velocity: 3
max_z_accel: 60

[force_move]
enable_force_move: true

[gcode_macro UNSAFE_ALLOW_JOG]
description: Allow Fluidd jogging without homing
gcode:
  SET_KINEMATIC_POSITION X=0 Y=0 Z=0

[gcode_macro UNSAFE_CLEAR_KINEMATIC]
description: Clear fake kinematic position
gcode:
  SET_KINEMATIC_POSITION CLEAR=XYZ

[stepper_x]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_max: 235
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
diag_pin: ^gpio4
run_current: 0.580
stealthchop_threshold: 0
driver_SGTHRS: 80

[stepper_y]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -70
position_min: -70
position_max: 85
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
diag_pin: ^gpio3
run_current: 0.580
stealthchop_threshold: 0
driver_SGTHRS: 80

[stepper_z]
step_pin: gpio19
dir_pin: !gpio28
enable_pin: !gpio2
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

[extruder]
step_pin: gpio14
dir_pin: !gpio13
enable_pin: !gpio15
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio23
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio27
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250

[tmc2209 extruder]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
run_current: 0.650
stealthchop_threshold: 999999

[heater_bed]
heater_pin: gpio21
sensor_type: ATC Semitec 104GT-2
sensor_pin: gpio26
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: gpio17

[heater_fan heatbreak_cooling_fan]
pin: gpio18

[heater_fan controller_fan]
pin: gpio20

[temperature_sensor pico]
sensor_type: temperature_mcu

[temperature_sensor eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
z_offset: 2.5
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 0
y_offset: -36

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 1

[bed_mesh]
horizontal_move_z: 1
speed: 80
mesh_min: 5, 5
mesh_max: 125, 44
probe_count: 9, 9
algorithm: bicubic

[safe_z_home]
home_xy_position: 75, 60
z_hop: 10
z_hop_speed: 25
speed: 200

[bed_screws]
screw1: 20, 10
screw1_name: front_left
screw2: 130, 10
screw2_name: front_right
screw3: 130, 40
screw3_name: rear_right
screw4: 20, 40
screw4_name: rear_left
horizontal_move_z: 5
speed: 80

[gcode_macro G28]
rename_existing: G28.1
gcode:
  G28.1 {rawparams}
  {% if not rawparams or (rawparams and 'Z' in rawparams) %}
    PROBE
    SET_Z_FROM_PROBE
  {% endif %}

[gcode_macro SET_Z_FROM_PROBE]
gcode:
  {% set cf = printer.configfile.settings %}
  SET_GCODE_OFFSET_ORIG Z={printer.probe.last_z_result - cf['probe_eddy_current btt_eddy'].z_offset + printer["gcode_macro SET_GCODE_OFFSET"].runtime_offset}
  G90
  G1 Z{cf.safe_z_home.z_hop}

[gcode_macro SET_GCODE_OFFSET]
rename_existing: SET_GCODE_OFFSET_ORIG
variable_restored: False
variable_runtime_offset: 0
gcode:
  SET_GCODE_OFFSET_ORIG { rawparams }

[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
gcode:
  BED_MESH_CLEAR
  G28 X Y
  G90
  G1 X{ (printer.toolhead.axis_minimum.x + printer.toolhead.axis_maximum.x) / 2 } Y{ (printer.toolhead.axis_minimum.y + printer.toolhead.axis_maximum.y) / 2 } F6000
  {% if 'z' not in printer.toolhead.homed_axes %}
    SET_KINEMATIC_POSITION Z={ printer.toolhead.axis_maximum.z-1 }
  {% endif %}
  PROBE_EDDY_CURRENT_CALIBRATE {rawparams}

[gcode_macro SINE_ALL_AXES]
description: Move XYZ in a synchronized sine-like path
gcode:
  {% set cycles = params.CYCLES|default(2)|int %}
  {% set feed = params.F|default(6000)|int %}
  {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
    {action_raise_error("Home XYZ first (G28) before SINE_ALL_AXES")}
  {% endif %}

  {% set xmin = printer.toolhead.axis_minimum.x + 10.0 %}
  {% set xmax = printer.toolhead.axis_maximum.x - 10.0 %}
  {% set ymin = printer.toolhead.axis_minimum.y + 10.0 %}
  {% set ymax = printer.toolhead.axis_maximum.y - 10.0 %}
  {% set zmin = 8.0 %}
  {% set zmax = [printer.toolhead.axis_maximum.z - 20.0, 35.0]|min %}
  {% if zmax <= zmin + 2.0 %}
    {action_raise_error("Z travel too small for SINE_ALL_AXES")}
  {% endif %}

  {% set xmid = (xmin + xmax) / 2.0 %}
  {% set ymid = (ymin + ymax) / 2.0 %}
  {% set zmid = (zmin + zmax) / 2.0 %}
  {% set xamp = (xmax - xmin) / 2.0 %}
  {% set yamp = (ymax - ymin) / 2.0 %}
  {% set zamp = (zmax - zmin) / 2.0 %}

  {% set sx = [0.0, 0.3827, 0.7071, 0.9239, 1.0, 0.9239, 0.7071, 0.3827, 0.0, -0.3827, -0.7071, -0.9239, -1.0, -0.9239, -0.7071, -0.3827] %}
  {% set sy = [1.0, 0.9239, 0.7071, 0.3827, 0.0, -0.3827, -0.7071, -0.9239, -1.0, -0.9239, -0.7071, -0.3827, 0.0, 0.3827, 0.7071, 0.9239] %}
  {% set sz = [0.7071, 0.9239, 1.0, 0.9239, 0.7071, 0.3827, 0.0, -0.3827, -0.7071, -0.9239, -1.0, -0.9239, -0.7071, -0.3827, 0.0, 0.3827] %}

  G90
  G1 X{xmid} Y{ymid} Z{zmin + 2.0} F{feed}
  {% for _ in range(cycles) %}
    {% for i in range(16) %}
      {% set xx = xmid + xamp * sx[i] %}
      {% set yy = ymid + yamp * sy[i] %}
      {% set zz = zmid + zamp * sz[i] %}
      G1 X{xx} Y{yy} Z{zz} F{feed}
    {% endfor %}
  {% endfor %}
  G1 X{xmid} Y{ymid} Z{zmin + 2.0} F{feed}

[virtual_sdcard]
path: /home/pegoku/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

